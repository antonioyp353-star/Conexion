
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexión AVÍVA2</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #060913;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        /* --- PANTALLA 1: CARGA SIMULADA --- */
        #wifi-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .wifi-signal {
            width: 70px;
            height: 70px;
            position: relative;
            margin-bottom: 20px;
        }

        .wave {
            border: 4px solid transparent;
            border-top-color: #00f2fe;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 1.2s infinite ease-in-out;
        }

        .w1 { width: 60px; height: 60px; animation-delay: 0.1s; }
        .w2 { width: 40px; height: 40px; animation-delay: 0.3s; }
        .w3 { width: 20px; height: 20px; animation-delay: 0.5s; }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; transform: translate(-50%, -50%) scale(0.9); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        }

        .loader-text {
            font-size: 0.95rem;
            letter-spacing: 2px;
            color: #38ef7d;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* --- PANTALLA 2: REVELACIÓN --- */
        #main-content {
            display: none;
            opacity: 0;
            transform: scale(0.85);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 500px;
        }

        #main-content.active {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .wifi-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
        }

        .wifi-status {
            color: #38ef7d;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .network-name {
            font-size: 1.2rem;
            font-weight: 900;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            margin-bottom: 12px;
        }

        .network-details {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.6;
            text-align: left;
            display: inline-block;
        }

        .network-details span {
            color: #ffb703;
            font-weight: 700;
        }

        .main-title {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 900;
            line-height: 1.2;
            color: #ffffff;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .god-title {
            display: block;
            font-size: clamp(2.2rem, 7vw, 3.6rem);
            color: #ffb703;
            text-shadow: 0 0 20px rgba(255, 183, 3, 0.8);
            margin-top: 5px;
        }

        .brand-aviva {
            font-family: 'Permanent Marker', cursive;
            font-size: 3.5rem;
            color: #ffffff;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            transform: rotate(-3deg);
            display: inline-block;
        }

        .sub-camp {
            display: block;
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: #38ef7d;
            font-weight: 700;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .bg-light {
            position: absolute;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(0,242,254,0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="bg-light"></div>

    <!-- Pantalla 1: Carga -->
    <div id="wifi-loader">
        <div class="wifi-signal">
            <div class="wave w1"></div>
            <div class="wave w2"></div>
            <div class="wave w3"></div>
        </div>
        <div class="loader-text">Conectando a RED: AVÍVA2...</div>
    </div>

    <!-- Pantalla 2: Mensaje y Detalles -->
    <div id="main-content">
        <div class="wifi-card">
            <div class="wifi-status">📶 RED DETECTADA</div>
            <div class="network-name">Espíritu_Santo_5G</div>
            <div class="network-details">
                ⚡ <strong>Ancho de banda:</strong> <span>Infinito</span><br>
                🔑 <strong>Contraseña:</strong> <span>Una oración sincera</span>
            </div>
        </div>

        <h1 class="main-title">
            Desconéctate del mundo
            <span class="god-title">y Conéctate con Dios</span>
        </h1>

        <div>
            <span class="brand-aviva">AVÍVA2</span>
            <span class="sub-camp">Campamento de Jóvenes</span>
        </div>
    </div>

    <script>
        setTimeout(() => {
            const loader = document.getElementById('wifi-loader');
            const content = document.getElementById('main-content');

            loader.style.opacity = '0';
            loader.style.transform = 'scale(0.8)';

            setTimeout(() => {
                loader.style.display = 'none';
                content.classList.add('active');
            }, 600);
        }, 2800);
    </script>
</body>
</html>
