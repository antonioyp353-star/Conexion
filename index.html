<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexión a Red</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080711;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- PANTALLA 1: FALSA CARGA DE WIFI --- */
        #wifi-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .wifi-icon {
            width: 80px;
            height: 80px;
            border: 4px solid stroke;
            position: relative;
            margin-bottom: 25px;
        }

        .wifi-circle {
            background: transparent;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top-color: #00d2ff;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: spin 1.2s infinite linear;
        }

        .c1 { width: 70px; height: 70px; }
        .c2 { width: 50px; height: 50px; animation-duration: 0.9s; animation-direction: reverse; }
        .c3 { width: 30px; height: 30px; }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .loader-text {
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #a0a0c0;
            text-transform: uppercase;
        }

        .dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            33% { content: '.'; }
            66% { content: '..'; }
            100% { content: '...'; }
        }

        /* --- PANTALLA 2: REVELACIÓN DEL MENSAJE --- */
        #main-content {
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8);
            transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            padding: 20px;
            max-width: 800px;
            position: absolute;
        }

        #main-content.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        .glow-title {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 900;
            line-height: 1.3;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 50%, #00d2ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
            margin-bottom: 20px;
        }

        .highlight-god {
            display: block;
            font-size: clamp(2.8rem, 8vw, 5.5rem);
            background: linear-gradient(135deg, #ffea00 0%, #ff9100 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(255, 145, 0, 0.5);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(255, 234, 0, 0.4)); }
            100% { transform: scale(1.03); filter: drop-shadow(0 0 30px rgba(255, 234, 0, 0.8)); }
        }

        .subtext {
            font-size: 1rem;
            color: #64748b;
            margin-top: 30px;
            font-style: italic;
        }

        /* Fondos dinámicos de luz */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: -1;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-30%, -40%) scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div id="wifi-loader">
        <div class="wifi-icon">
            <div class="wifi-circle c1"></div>
            <div class="wifi-circle c2"></div>
            <div class="wifi-circle c3"></div>
        </div>
        <div class="loader-text">Conectando a la red<span class="dots"></span></div>
    </div>

    <div id="main-content">
        <h1 class="glow-title">
            Desconéctate del mundo<br>
            <span style="-webkit-text-fill-color: #fff; font-size: 0.6em; font-weight: 300;">y</span><br>
            <span class="highlight-god">Conéctate con Dios</span>
        </h1>
        <p class="subtext">La mejor señal no usa cables ni contraseñas.</p>
    </div>

    <script>
        // Transición de la simulación de Wi-Fi al mensaje (3 segundos)
        setTimeout(() => {
            const loader = document.getElementById('wifi-loader');
            const content = document.getElementById('main-content');

            loader.style.opacity = '0';
            loader.style.transform = 'scale(0.5)';

            setTimeout(() => {
                loader.style.display = 'none';
                content.classList.add('active');
            }, 800);
        }, 3000);
    </script>
</body>
</html>
